- key: li2025spid
  type: workshop
  year: 2025
  abbr: NeurIPS W
  title: Symbolic Policy Distillation for Interpretable Reinforcement Learning
  authors:
  - Peilang Li
  - Umer Siddique
  - Yongcan Cao
  venue: Mechanistic Interpretability Workshop, NeurIPS
  abstract: Deep reinforcement learning (RL) policies based on deep neural networks (DNNs) achieve strong performance but are often opaque, hindering transparency, interpretability, and safe deployment. Interpretable policy distillation seeks to transfer knowledge from these black-box DNN policies into simpler, human-understandable forms. While prior work has extensively studied performance retention, fidelity to the original DNN policies has remained underexplored, which is crucial for ensuring that the distilled policies faithfully capture the underlying decision-making logic. To address this gap, we propose GM-DAGGER, a novel data aggregation method that employs a geometric mean loss to preserve fidelity without compromising performance. Building on this, we introduce Symbolic Policy Interpretable Distillation (SPID), a framework that distills DNN policies into symbolic analytical equations via symbolic regression. Through extensive experiments across six environments and five deep RL
    algorithms, we show that SPID achieves superior preservation of both performance and fidelity, while providing interpretable policies that provide mechanistic insights into policy behavior and training dynamics.
- key: wallace2025recollab
  type: workshop
  year: 2025
  abbr: NeurIPS W
  title: 'ReCollab: Retrieval-Augmented LLMs for Cooperative Ad-hoc Teammate Modeling'
  authors:
  - Conor Wallace
  - Umer Siddique
  - Yongcan Cao
  venue: Bridging Language, Agent, and World Models Workshop (LAW), NeurIPS
  img: neurips2025-recollab.png
  abstract: 'Ad-hoc teamwork (AHT) requires agents to infer the behavior of previously unseen teammates and adapt their policy accordingly. Conventional approaches often rely on fixed probabilistic models or classifiers, which can be brittle under partial observability and limited interaction. Large language models (LLMs) offer a flexible alternative: by mapping short behavioral traces into high-level hypotheses, they can serve as world models over teammate behavior. We introduce \Collab, a language-based framework that classifies partner types using a behavior rubric derived from trajectory features, and extend it to \ReCollab, which incorporates retrieval-augmented generation (RAG) to stabilize inference with exemplar trajectories. In the cooperative Overcooked environment, \Collab effectively distinguishes teammate types, while \ReCollab consistently improves adaptation across layouts, achieving Pareto-optimal trade-offs between classification accuracy and episodic return. These findings
    demonstrate the potential of LLMs as behavioral world models for AHT and highlight the importance of retrieval grounding in challenging coordination settings.'
  links:
    arXiv: https://arxiv.org/abs/2512.22129
- key: cofield2025modifly
  type: workshop
  year: 2025
  abbr: MABS
  title: 'MODIFLY: A Scalable End-to-end Multi-Agent Simulation for Unmanned Aerial Vehicles'
  authors:
  - Jeremy Cofield
  - Umer Siddique
  - Yongcan Cao
  venue: International Workshop on Multi-Agent-Based Simulation (MABS)
  abstract: Multi-agent unmanned aerial vehicle (UAV) systems have emerged as a promising solution for complex applications such as industrial automation, surveillance, and disaster response. However, the application of multi-agent UAV coordination remains challenging due to the lack of consideration of real-world constraints such as communication link degradation, scalability issues, and the need for realistic training environments. Existing simulation platforms often lack the fidelity and flexibility required to bridge the gap between simulation and deployment. To address these limitations, we propose MODIFLY, a scalable, cross-platform, end-to-end simulation platform tailored for multi-agent UAV control. MODIFLY introduces dynamic communication modeling, including link degradation, to accurately simulate real-world UAV operations. It supports distributed execution across multiple UAVs, seamless coordination, real-time monitoring, and user input capture. MODIFLY uniquely integrates real
    drones with virtual environments, allowing UAVs to interact with simulated obstacles and peer ones for hybrid reality testing. Additionally, the platform is designed to facilitate reinforcement learning (RL) research by providing compatibility with popular libraries like OpenAI Gym and PettingZoo, supporting both single-agent and multi-agent RL environments. MODIFLY offers an intuitive interface for real-time parameter tuning and performance analysis, making it a versatile tool for researchers and practitioners to develop and validate UAV coordination strategies under realistic conditions.
  links:
    Paper: https://link.springer.com/chapter/10.1007/978-3-032-16328-8_9
    OpenReview: https://openreview.net/forum?id=EAUPxGTQ6C
- key: siddique2025fappo
  type: workshop
  year: 2025
  abbr: AAMAS
  title: Towards Fair and Efficient Policy Learning in Cooperative Multi-Agent Reinforcement Learning
  authors:
  - Umer Siddique
  - Peilang Li
  - Yongcan Cao
  venue: AAMAS (Extended Abstract)
  img: aamas2025-fappo.png
  abstract: In this paper, we consider the problem of learning independent fair policies in cooperative multi-agent reinforcement learning (MARL). Our objective is to design multiple policies simultaneously that optimize a welfare function for fairness. To achieve this objective, we propose a novel Fairness-Aware multi-agent Proximal Policy Optimization (FAPPO) algorithm, which enables each agent to independently learn its policy while optimizing a welfare function. Unlike standard approaches that focus on maximizing a performance metric such as rewards, FAPPO focuses on fairness in an independent learning setting, where each agent estimates its local value function. When inter-agent communication is allowed, we further introduce an attention-based variant of FAPPO (AT-FAPPO), which incorporates a self-attention mechanism to facilitate communication and coordination among agents. This variant allows agents to share relevant information during training, leading to more fair outcomes. To show
    the effectiveness of the proposed methods, we conduct experiments in various environments and show that our approach outperforms existing methods both in terms of efficiency and equity.
  links:
    PDF: https://www.ifaamas.org/Proceedings/aamas2025/pdfs/p2744.pdf
- key: siddique2025malta
  type: workshop
  year: 2025
  abbr: AAAI W
  title: 'Fairness in Traffic Control: Decentralized Multi-agent Reinforcement Learning with Generalized Gini Welfare Functions'
  authors:
  - Umer Siddique
  - Peilang Li
  - Yongcan Cao
  venue: Multi-Agent RL for Transportation Autonomy (MALTA) Workshop, AAAI
  img: traffic-fair-marl.png
  abstract: 'In this paper, we address the issue of learning fair policies in decentralized cooperative multi-agent reinforcement learning (MARL), with a focus on traffic light control systems. We show that standard MARL methods that optimize the expected rewards often lead to unfair treatment across different intersections. To overcome this limitation, we aim to design control policies that optimize a generalized Gini welfare function that explicitly encodes two aspects of fairness: efficiency and equity. Specifically, we propose three novel adaptations of MARL baselines that enable agents to learn decentralized fair policies, where each agent estimates its local value function while contributing to welfare optimization. We validate our approaches through extensive experiments across six traffic control environments with varying complexities and traffic layouts. The results demonstrate that our proposed methods consistently outperform existing MARL approaches both in terms of efficiency
    and equity.'
  links:
    OpenReview: https://openreview.net/forum?id=Y1wckpUjsd
- key: wallace2024optrans
  type: workshop
  year: 2024
  abbr: RLC W
  title: 'Opponent Transformer: Modeling Opponent Policies as a Sequence Problem'
  authors:
  - Conor Wallace
  - Umer Siddique
  - Yongcan Cao
  venue: Coordination and Cooperation for Multi-Agent RL Workshop (CoCoMARL), RLC
  abstract: The ability of an agent to understand the intentions of others in a multi-agent system, also called opponent modeling, is critical for the design of effective local control policies. One main challenge is the unavailability of other agents' episodic trajectories at execution. To address the challenge, we propose a new approach that explicitly models the episodic trajectories of others. In particular, the proposed approach is to cast the opponent modeling problem as a sequence modeling problem via conditioning a transformer model on the sequence of the agent's local trajectory and predicting each opponent agent's trajectory. To evaluate the effectiveness of the proposed approach, we conduct experiments using a set of multi-agent environments that capture both cooperative and competitive payoff structures. The results show that the proposed method can provide better opponent modeling capabilities while achieving competitive or superior episodic returns.
  links:
    OpenReview: https://openreview.net/forum?id=qzOnyQiCAc
- key: siddique2024fappo
  type: workshop
  year: 2024
  abbr: RLC W
  title: Towards Fair and Equitable Policy Learning in Cooperative Multi-Agent Reinforcement Learning
  authors:
  - Umer Siddique
  - Peilang Li
  - Yongcan Cao
  venue: Coordination and Cooperation for Multi-Agent RL Workshop (CoCoMARL), RLC
  img: rlc2024-fappo.jpg
  abstract: In this paper, we consider the problem of learning independent fair policies in cooperative multi-agent reinforcement learning (MARL). The objective is to design multiple policies simultaneously that can optimize a welfare function for fairness. To achieve this objective, we propose a novel Fairness-Aware multi-agent Proximal Policy Optimization (FAPPO) algorithm, which learns individual policies for all agents separately and optimizes a welfare function to ensure fairness among them, in contrast to optimizing the discounted rewards. The proposed approach is shown to learn fair policies in the independent learning setting, where each agent estimates its local value function. When inter-agent communication is allowed, we further introduce an attention-based variant of FAPPO (AT-FAPPO) by incorporating a self-attention mechanism for inter-agent communication. This variant enables agents to communicate and coordinate their actions, potentially leading to more fair solutions by leveraging
    the ability to share relevant information during training. To show the effectiveness of the proposed methods, we conduct experiments in two environments and show that our approach outperforms previous methods both in terms of efficiency and equity.
  links:
    OpenReview: https://openreview.net/forum?id=OC5aj4oVdL
- key: siddique2023fpbrl
  type: workshop
  year: 2023
  abbr: ICML W
  title: Fairness in Preference-based Reinforcement Learning
  authors:
  - Umer Siddique
  - Abhinav Sinha
  - Yongcan Cao
  venue: The Many Facets of Preference-Based Learning Workshop, ICML
  img: icml2023-fpbrl.png
  abstract: In this paper, we address the issue of fairness in preference-based reinforcement learning (PbRL) in the presence of multiple objectives. The main objective is to design control policies that can optimize multiple objectives while treating each objective fairly. Toward this objective, we design a new fairness-induced preference-based reinforcement learning or FPbRL. The main idea of FPbRL is to learn vector reward functions associated with multiple objectives via new welfare-based preferences rather than reward-based preference in PbRL, coupled with policy learning via maximizing a generalized Gini welfare function. Finally, we provide experiment studies on three different environments to show that the proposed FPbRL approach can achieve both efficiency and equity for learning effective and fair policies.
  links:
    arXiv: https://arxiv.org/abs/2306.09995
- key: yu2023ggf
  type: workshop
  year: 2023
  abbr: ALA
  title: Fair Deep Reinforcement Learning with Generalized Gini Welfare Functions
  authors:
  - Guanbao Yu
  - Umer Siddique
  - Paul Weng
  venue: Adaptive and Learning Agents (ALA) Workshop, AAMAS
  award: Best Paper Award
  img: ala2023-ggf.png
  abstract: Learning fair policies in reinforcement learning (RL) is important when the RL agent’s actions may impact many users. In this paper, we investigate a generalization of this problem where equity is still desired, but some users may be entitled to preferential treatment. We formalize this more sophisticated fair optimization problem in deep RL, provide some theoretical discussion of its difficulties, and explain how existing deep RL algorithms can be adapted to tackle it. Our algorithmic innovations notably include a state-augmented DQN-based method for learning stochastic policies, which also applies to the usual fair optimization setting without any preferential treatment. We empirically validate our propositions and analyze the experimental results on several application domains.
