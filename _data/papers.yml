- key: siddique2026inference
  type: conference
  year: 2026
  abbr: RLC
  selected: 1
  title: Inference-Time Policy Alignment for Fair Reinforcement Learning
  authors:
  - Umer Siddique
  - Peilang Li
  - Conor Wallace
  - Yongcan Cao
  venue: Reinforcement Learning Conference (RLC)
  img: rlc2026-inference-fair.png
  abstract: Deep reinforcement learning (RL) agents achieve strong performance by optimizing scalar reward functions. However, once deployed, the policies of these RL agents are often rigid and costly to adapt to new performance criteria. For instance, an agent trained to maximize expected cumulative reward may not accommodate previously unknown stakeholder preferences. Existing approaches to achieve fairness, a type of preference, in RL typically assume that such preferences are known a priori and require complete retraining of the policy under a fairness-oriented metric. Inspired by inference-time alignment in large language models, we investigate the problem of steering a pretrained RL policy toward welfare-based fairness objectives at inference time without updating the base policy's parameters. We formalize inference-time fairness alignment as a policy shaping problem and propose a multiplicative policy shaping framework that adjusts action probabilities using action-dependent welfare
    scores, thus requiring no modification to the base policy. Our framework is general and compatible with any deep RL agent. Through extensive experiments across multiple domains, we demonstrate that inference-time policy shaping substantially improves welfare-based fairness objectives while preserving core task performance.
  links:
    arXiv: https://arxiv.org/abs/2608.00175
    OpenReview: https://openreview.net/forum?id=hK3PNEnbNf
- key: siddique2026eventmarl
  type: conference
  year: 2026
  abbr: ACC
  selected: 2
  title: Adaptive Event-Triggered Policy Gradient for Multi-Agent Reinforcement Learning
  authors:
  - Umer Siddique
  - Abhinav Sinha
  - Yongcan Cao
  venue: American Control Conference (ACC)
  img: acc2026-event-marl.png
  abstract: Conventional multi-agent reinforcement learning (MARL) methods rely on time-triggered execution, where agents sample and communicate actions at fixed intervals. This approach is often computationally expensive and communication-intensive. To address this limitation, we propose ET-MAPG (Event-Triggered Multi-Agent Policy Gradient reinforcement learning), a framework that jointly learns an agent's control policy and its event-triggering policy. Unlike prior work that decouples these mechanisms, ET-MAPG integrates them into a unified learning process, enabling agents to learn not only what action to take but also when to execute it. For scenarios with inter-agent communication, we introduce AET-MAPG, an attention-based variant that leverages a self-attention mechanism to learn selective communication patterns. AET-MAPG empowers agents to determine not only when to trigger an action but also with whom to communicate and what information to exchange, thereby optimizing coordination.
    Both methods can be integrated with any policy gradient MARL algorithm. Extensive experiments across diverse MARL benchmarks demonstrate that our approaches achieve performance comparable to state-of-the-art, time-triggered baselines while significantly reducing both computational load and communication overhead.
  links:
    arXiv: https://arxiv.org/abs/2509.20338
- key: siddique2026enclosing
  type: conference
  year: 2026
  abbr: AIAA
  title: Deep Reinforcement Learning for Target Enclosing Under Limited Sensing and Autopilot Lag
  authors:
  - Umer Siddique
  - Praveen Kumar Ranjan
  - Abhinav Sinha
  - Yongcan Cao
  venue: AIAA SciTech Forum
  abstract: 'This paper proposes a deep reinforcement learning (RL) based solution for the target enclosing problem using a non-holonomic unmanned aerial vehicle (UAV) operating under limited sensing and control lag. Instead of using the mathematical or analytical controllers, our approach enables an end-to-end learning-based agent to autonomously interact with the environment and develop enclosing strategies that ensure safety and containment around a stationary target. A carefully designed reward function guides the learning agent by combining three reward components: a quadratic distance-based reward penalizing deviation from the desired enclosing radius, a state-dependent velocity reward that promotes stability during radial transitions, and an acceleration penalty to enforce a smooth trajectory. Thus, the agent learns to trade off between maintaining an optimal enclosing geometry and mitigating aggressive control responses, especially in the presence of autopilot lag. Our results demonstrate
    that the learned policy through our carefully designed reward function achieves reliable target enclosing performance while matching or outperforming the analytical controllers.'
- key: manzoor2026media
  type: conference
  year: 2026
  abbr: ACL
  title: 'A Multi-View Media Profiling Suite: Resources, Evaluation, and Analysis'
  authors:
  - Muhammad Arslan Manzoor
  - Dilshod Azizov
  - Daniil Orel
  - Umer Siddique
  - Zain Muhammad Mujahid
  - Yufang Hou
  - Preslav Nakov
  venue: Annual Meeting of the Association for Computational Linguistics (ACL)
  img: acl2026-media-profiling.png
  abstract: News outlets shape public opinion at a scale that makes automated detection of political bias and factuality essential. However, the field still lacks unified resources, comprehensive evaluations across diverse approaches, and systematic analyses of the representations and fusion strategies that matter most, especially under label sparsity and dataset diversity. In addition, there is little empirical work reporting broad, observation-driven findings about what consistently works, what fails, and why. We address these gaps through four main contributions. First, we introduce MBFC-2025, a large-scale label set covering approximately 2,600 outlets from Media Bias/Fact Check (MBFC). Second, we construct multiview representations for ACL-2020 (Panayotov et al., 2022), which includes around 900 outlets, as well as for MBFC-2025. These representations span Alexa graphs, hyperlink graphs, LLM-derived graphs, articles, and Wikipedia descriptions. Third, we provide a systematic evaluation
    and analysis of embedding views and fusion strategies, including a reinforcement learning-based fusion variant. Fourth, we conduct extensive experiments that achieve state-of-the-art results on ACL-2020 and establish strong benchmarks on MBFC-2025.
  links:
    arXiv: https://arxiv.org/abs/2605.01336
- key: siddique2025pareto
  type: conference
  year: 2025
  abbr: RLC
  selected: 4
  title: Learning Fair Pareto-Optimal Policies in Multi-Objective Reinforcement Learning
  authors:
  - Umer Siddique
  - Peilang Li
  - Yongcan Cao
  venue: Reinforcement Learning Conference (RLC)
  img: rlc2025-fair-pareto.png
  abstract: 'Fairness is an important aspect of decision-making in multi-objective reinforcement learning (MORL), where policies must ensure both optimality and equity across multiple, potentially conflicting objectives. While single-policy MORL methods can learn fair policies for fixed user preferences using welfare functions such as the generalized Gini welfare function (GGF), they fail to provide the diverse set of policies necessary for dynamic or unknown user preferences. To address this limitation, we formalize the fair optimization problem in multi-policy MORL, where the goal is to learn a set of Pareto-optimal policies that ensure fairness across all possible user preferences. Our key technical contributions are threefold: (1) We show that for concave, piecewise-linear welfare functions (e.g., GGF), fair policies remain in the convex coverage set (CCS), which is an approximated Pareto front for linear scalarization. (2) We demonstrate that non-stationary policies, augmented with
    accrued reward histories, and stochastic policies improve fairness by dynamically adapting to historical inequities. (3) We propose three novel algorithms, which include integrating GGF with multi-policy multi-objective Q-Learning (MOQL), state-augmented multi-policy MOQL for learning non-statoinary policies, and its novel extension for learning stochastic policies. We evaluate our algorithms across various domains and compare our methods against the state-of-the-art MORL baselines. The empirical results show that our methods learn a set of fair policies that accommodate different user preferences.'
  links:
    PDF: https://rlj.cs.umass.edu/2025/papers/RLJ_RLC_2025_350.pdf
    arXiv: https://arxiv.org/abs/2606.18111
- key: li2025interpretability
  type: conference
  year: 2025
  abbr: RLC
  title: 'From Explainability to Interpretability: Interpretable Reinforcement Learning Via Model Explanations'
  authors:
  - Peilang Li
  - Umer Siddique
  - Yongcan Cao
  venue: Reinforcement Learning Conference (RLC)
  img: rlc2025-interpretability.jpg
  abstract: 'Deep reinforcement learning (RL) has shown remarkable success in complex domains, however, the inherent black box nature of deep neural network policies raises significant challenges in understanding and trusting the decision-making processes. While existing explainable RL methods provide local insights, they fail to deliver a global understanding of the model, particularly in high-stakes applications. To overcome this limitation, we propose a novel model-agnostic approach that bridges the gap between explainability and interpretability by leveraging Shapley values to transform complex deep RL policies into transparent representations. The proposed approach offers two key contributions: a novel approach employing Shapley values to policy interpretation beyond local explanations and a general framework applicable to off-policy and on-policy algorithms. We evaluate our approach with three existing deep RL algorithms and validate its performance in two classic control environments.
    The results demonstrate that our approach not only preserves the original models'' performance but also generates more stable interpretable policies.'
  links:
    PDF: https://rlj.cs.umass.edu/2025/papers/RLJ_RLC_2025_253.pdf
    arXiv: https://arxiv.org/abs/2501.09858
- key: wallace2025transam
  type: conference
  year: 2025
  abbr: RLC
  title: 'TransAM: Transformer-Based Agent Modeling for Multi-Agent Systems via Local Trajectory Encoding'
  authors:
  - Conor Wallace
  - Umer Siddique
  - Yongcan Cao
  venue: Reinforcement Learning Conference (RLC)
  img: rlc2025-transam.png
  abstract: Agent modeling is a critical component in developing effective policies within multi-agent systems, as it enables agents to form beliefs about the behaviors, intentions, and competencies of others. Many existing approaches assume access to other agents' episodic trajectories, a condition often unrealistic in real-world applications. Consequently, a practical agent modeling approach must learn a robust representation of the policies of the other agents based only on the local trajectory of the controlled agent. In this paper, we propose \texttt{TransAM}, a novel transformer-based agent modeling approach to encode local trajectories into an embedding space that effectively captures the policies of other agents. We evaluate the performance of the proposed method in cooperative, competitive, and mixed multi-agent environments. Extensive experimental results demonstrate that our approach generates strong policy representations, improves agent modeling, and leads to higher episodic
    returns.
  links:
    PDF: https://rlj.cs.umass.edu/2025/papers/RLJ_RLC_2025_275.pdf
    arXiv: https://arxiv.org/abs/2508.02826
- key: siddique2025eventrl
  type: conference
  year: 2025
  abbr: ACC
  title: Adaptive Event-triggered Reinforcement Learning Control for Complex Nonlinear Systems
  authors:
  - Umer Siddique
  - Abhinav Sinha
  - Yongcan Cao
  venue: American Control Conference (ACC)
  img: acc2025-event-rl.png
  abstract: In this paper, we propose an adaptive event-triggered reinforcement learning control for continuous-time nonlinear systems, subject to bounded uncertainties, characterized by complex interactions. Specifically, the proposed method is capable of jointly learning both the control policy and the communication policy, thereby reducing the number of parameters and computational overhead when learning them separately or only one of them. By augmenting the state space with accrued rewards that represent the performance over the entire trajectory, we show that accurate and efficient determination of triggering conditions is possible without the need for explicit learning triggering conditions, thereby leading to an adaptive non-stationary policy. Finally, we provide several numerical examples to demonstrate the effectiveness of the proposed approach.
  links:
    arXiv: https://arxiv.org/abs/2409.19769
- key: siddique2024capture
  type: conference
  year: 2024
  abbr: AIAA
  title: On Deep Reinforcement Learning for Target Capture Autonomous Guidance
  authors:
  - Umer Siddique
  - Abhinav Sinha
  - Yongcan Cao
  venue: AIAA SciTech Forum
  abstract: This paper explores the prospects of motion planning of autonomous vehicles using deep reinforcement learning (DRL). We are particularly interested in a goal-directed setting where the need is to design an optimal guidance strategy for a pursuing autonomous vehicle (the pursuer, which is also the DRL agent) to capture an adversary (the target). To this end, we first formulate the target capture guidance problem as a Markov Decision Process (MDP) wherein the kinematics of relative motion between the vehicles constitute the MDP, and the pursuer's lateral acceleration (chosen as its steering control to account for turn constraints) is the action of DRL agent. We show that a multifaceted reward function motivated by the collision conditions is sufficient and effective in designing the reinforcement learning action that enables the pursuer to capture the target regardless of the latter's motion. We then empirically evaluate the performance of the trained agent in various target capture
    scenarios.
  links:
    Paper: https://arc.aiaa.org/doi/10.2514/6.2024-0957
- key: yu2023preferential
  type: conference
  year: 2023
  abbr: ECAI
  title: Fair Deep Reinforcement Learning with Preferential Treatment
  authors:
  - Guanbao Yu
  - Umer Siddique
  - Paul Weng
  venue: European Conference on Artificial Intelligence (ECAI)
  abstract: 'Learning fair policies in reinforcement learning (RL) is important when the RL agent may impact many users. We investigate a variant of this problem where equity is still desired, but some users may be entitled to preferential treatment. In this paper, we formalize this more sophisticated fair optimization problem in deep RL using generalized fair social welfare functions (SWF), provide a theoretical discussion to justify our approach, explain how deep RL algorithms can be adapted to tackle it, and empirically validate our propositions on several domains. Our contributions are both theoretical and algorithmic, notably: (1) We obtain a general bound on the suboptimality gap in terms of SWF-optimality using average reward of a policy SWF-optimal for the discounted reward, which notably justifies using standard deep RL algorithms, even for the average reward; (2) Our algorithmic innovations include a state-augmented DQN-based method for learning either deterministic or stochastic
    policies, which also applies to the usual fair optimization setting without any preferential treatment'
  links:
    Paper: https://ebooks.iospress.nl/doi/10.3233/FAIA230606
- key: zimmer2021soto
  type: conference
  year: 2021
  abbr: ICML
  selected: 5
  title: Learning Fair Policies in Decentralized Cooperative Multi-Agent Reinforcement Learning
  authors:
  - Matthieu Zimmer
  - Claire Glanois
  - Umer Siddique
  - Paul Weng
  venue: International Conference on Machine Learning (ICML)
  img: icml2021-soto.png
  abstract: 'We consider the problem of learning fair policies in (deep) cooperative multi-agent reinforcement learning (MARL). We formalize it in a principled way as the problem of optimizing a welfare function that explicitly encodes two important aspects of fairness: efficiency and equity. As a solution method, we propose a novel neural network architecture, which is composed of two sub-networks specifically designed for taking into account the two aspects of fairness. In experiments, we demonstrate the importance of the two sub-networks for fair optimization. Our overall approach is general as it can accommodate any (sub)differentiable welfare function. Therefore, it is compatible with various notions of fairness that have been proposed in the literature (e.g., lexicographic maximin, generalized Gini social welfare function, proportional fairness). Our solution method is generic and can be implemented in various MARL settings: centralized training and decentralized execution, or fully
    decentralized. Finally, we experimentally validate our approach in various domains and show that it can perform much better than previous methods.'
  links:
    PMLR: https://proceedings.mlr.press/v139/zimmer21a.html
    arXiv: https://arxiv.org/abs/2012.09421
- key: siddique2020fair
  type: conference
  year: 2020
  abbr: ICML
  selected: 6
  title: Learning Fair Policies in Multi-Objective (Deep) Reinforcement Learning with Average and Discounted Rewards
  authors:
  - Umer Siddique
  - Paul Weng
  - Matthieu Zimmer
  venue: International Conference on Machine Learning (ICML)
  img: icml2020-fair-drl.png
  abstract: 'As the operations of autonomous systems generally affect simultaneously several users, it is crucial that their designs account for fairness considerations. In contrast to standard (deep) reinforcement learning (RL), we investigate the problem of learning a policy that treats its users equitably. In this paper, we formulate this novel RL problem, in which an objective function, which encodes a notion of fairness that we formally define, is optimized. For this problem, we provide a theoretical discussion where we examine the case of discounted rewards and that of average rewards. During this analysis, we notably derive a new result in the standard RL setting, which is of independent interest: it states a novel bound on the approximation error with respect to the optimal average reward of that of a policy optimal for the discounted reward. Since learning with discounted rewards is generally easier, this discussion further justifies finding a fair policy for the average reward
    by learning a fair policy for the discounted reward. Thus, we describe how several classic deep RL algorithms can be adapted to our fair optimization problem, and we validate our approach with extensive experiments in three different domains.'
  links:
    PMLR: https://proceedings.mlr.press/v119/siddique20a.html
    arXiv: https://arxiv.org/abs/2008.07773
    Talk: https://slideslive.com/38928455/learning-fair-policies-in-multiobjective-deep-reinforcement-learning-with-average-and-discounted-rewards
